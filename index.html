<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Turkey Escape — Run to the Forest!</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#2b1a0e;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#5a3a1a 0%,#2b1a0e 70%)}
  #stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));max-width:1280px;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:6px;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
  #hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#fff8e6;font-size:11px;opacity:.55;pointer-events:none;letter-spacing:.5px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hint">TURKEY ESCAPE &middot; a completely original game &middot; no downloads, works offline</div>
</div></div>
<script>
"use strict";
/* =====================================================================
   TURKEY ESCAPE — original HTML5 Canvas game, built for make.fun
   bounty turkey-run-game-01. 100% original vector art drawn in code,
   original WebAudio synth sounds, no external assets, no network.
   ===================================================================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;

/* ---------------- state ---------------- */
let state = 'title';           // title | playing | paused | over | win
let score = 0, lives = 3, distance = 0, cornCount = 0;
let speed = 260, spawnTimer = 0, cornTimer = 2.2, elapsed = 0;
let shake = 0, flash = 0, muted = false, musicOn = true;
let best = 0;
try { best = parseInt(localStorage.getItem('turkeyEscapeBest') || '0', 10) || 0; } catch (e) { best = 0; }
const WIN_DIST = 1500;
const LANES = [170, 285, 400]; // y-centres of the 3 lanes
let lane = 1;                  // 0 top, 1 middle, 2 bottom
let turkey = { x: 170, y: LANES[1], vy: 0, jumping: false, ducking: false, run: 0, squash: 0, tilt: 0 };
let farmerX = 62, farmerBob = 0;
let obstacles = [], corns = [], particles = [], leaves = [], clouds = [], treesFar = [], treesMid = [];
let keys = {};
let frame = 0, lastTs = 0;

/* ---------------- audio (original WebAudio synth) ---------------- */
let AC = null, musicTimer = null, musicStep = 0;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted || !audio()) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol) {
  if (muted || !audio()) return;
  const len = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf; g.gain.value = vol || 0.25;
  s.connect(g); g.connect(AC.destination); s.start();
}
const sfx = {
  jump()  { tone(280, 0.18, 'sine', 0.18, 620); },
  coin()  { tone(880, 0.09, 'square', 0.10); tone(1318, 0.16, 'square', 0.10, null, 0.08); },
  crash() { noiseBurst(0.25, 0.30); tone(160, 0.3, 'sawtooth', 0.18, 55); },
  gobble(){ tone(420, 0.07, 'square', 0.10, 300); tone(380, 0.07, 'square', 0.10, 280, 0.08); tone(430, 0.09, 'square', 0.10, 290, 0.16); },
  win()   { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, null, i * 0.13)); },
  click() { tone(600, 0.06, 'triangle', 0.10); }
};
// Cheerful original loop: C - F - G - C, plucky triangle notes
const MELODY = [523, 659, 784, 659, 587, 698, 880, 698, 659, 784, 988, 784, 880, 784, 659, 523];
function startMusic() {
  if (musicTimer || !musicOn) return;
  musicStep = 0;
  musicTimer = setInterval(() => {
    if (muted || state !== 'playing') return;
    const f = MELODY[musicStep % MELODY.length];
    tone(f, 0.22, 'triangle', 0.05);
    if (musicStep % 4 === 0) tone(f / 2, 0.3, 'sine', 0.05);
    musicStep++;
  }, 210);
}
function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

/* ---------------- scenery ---------------- */
function initScenery() {
  clouds = []; treesFar = []; treesMid = []; leaves = [];
  for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 80, s: 0.6 + Math.random() * 0.9, v: 8 + Math.random() * 10 });
  for (let i = 0; i < 14; i++) treesFar.push({ x: i * 75 + Math.random() * 40, h: 70 + Math.random() * 60, c: ['#7a9a4d', '#8fae5a', '#6b8f45'][i % 3] });
  for (let i = 0; i < 10; i++) treesMid.push({ x: i * 110 + Math.random() * 50, h: 90 + Math.random() * 70, c: ['#c96a1e', '#d9822b', '#a34d12'][i % 3] });
  for (let i = 0; i < 26; i++) leaves.push({ x: Math.random() * W, y: Math.random() * H, s: 3 + Math.random() * 4, v: 20 + Math.random() * 30, ph: Math.random() * 6.28, c: ['#e8a13a', '#d94f2b', '#f2c14e', '#c96a1e'][i % 4] });
}
initScenery();

/* ---------------- helpers ---------------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function burst(x, y, color, n, spd) {
  for (let i = 0; i < (n || 14); i++) {
    const a = Math.random() * Math.PI * 2, v = (spd || 160) * (0.4 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.6 + Math.random() * 0.4, max: 1, c: color, s: 3 + Math.random() * 4 });
  }
}
function laneY() { return LANES[lane]; }

/* ---------------- spawning ---------------- */
function spawnObstacle() {
  const r = Math.random();
  const type = r < 0.38 ? 'fence' : r < 0.68 ? 'oven' : 'net';
  const ln = Math.floor(Math.random() * 3);
  // never block all 3 lanes at once: if two obstacles already share this x-band, pick a free lane
  obstacles.push({ type, lane: ln, x: W + 60, w: type === 'oven' ? 62 : 52, passed: false });
}
function spawnCorn() {
  const ln = Math.floor(Math.random() * 3);
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) corns.push({ lane: ln, x: W + 60 + i * 46, taken: false, ph: Math.random() * 6 });
}

/* ---------------- game flow ---------------- */
function resetGame() {
  score = 0; lives = 3; distance = 0; cornCount = 0; elapsed = 0;
  speed = 260; spawnTimer = 1.0; cornTimer = 2.0;
  lane = 1; turkey = { x: 170, y: LANES[1], vy: 0, jumping: false, ducking: false, run: 0, squash: 0, tilt: 0 };
  farmerX = 62; obstacles = []; corns = []; particles = [];
  state = 'playing'; audio(); startMusic(); sfx.gobble();
}
function gameOver(win) {
  state = win ? 'win' : 'over';
  stopMusic();
  if (win) { sfx.win(); burst(turkey.x, turkey.y - 40, '#f2c14e', 40, 260); }
  else sfx.crash();
  if (score > best) { best = score; try { localStorage.setItem('turkeyEscapeBest', String(best)); } catch (e) {} }
}
function hitObstacle(ob) {
  lives--; shake = 14; flash = 0.35; farmerX += 34; sfx.crash();
  burst(turkey.x + 20, turkey.y - 20, '#ffffff', 18, 200);
  burst(turkey.x, turkey.y - 10, '#8b5a2b', 10, 140);
  ob.passed = true;
  if (lives <= 0) gameOver(false);
}
function moveLane(dir) {
  const nl = Math.max(0, Math.min(2, lane + dir));
  if (nl !== lane) { lane = nl; tone(500, 0.05, 'triangle', 0.06, 650); }
}
function doJump() {
  if (state !== 'playing') return;
  if (!turkey.jumping) { turkey.vy = -640; turkey.jumping = true; turkey.ducking = false; turkey.squash = -0.25; sfx.jump(); }
}
function doDuck(on) { if (state === 'playing') turkey.ducking = !!on; }

/* ---------------- update ---------------- */
function update(dt) {
  frame++;
  // scenery drift (always, for a living title screen)
  const drift = state === 'playing' ? speed : 40;
  clouds.forEach(c => { c.x -= c.v * dt * (state === 'playing' ? 1.6 : 1); if (c.x < -120) { c.x = W + 80; c.y = 30 + Math.random() * 80; } });
  treesFar.forEach(t => { t.x -= drift * 0.25 * dt; if (t.x < -60) t.x = W + 40; });
  treesMid.forEach(t => { t.x -= drift * 0.5 * dt; if (t.x < -70) t.x = W + 50; });
  leaves.forEach(l => { l.x -= (drift * 0.35 + l.v) * dt; l.y += Math.sin(frame * 0.02 + l.ph) * 0.6 + 12 * dt; if (l.x < -10) { l.x = W + 10; l.y = Math.random() * 200; } if (l.y > H) l.y = -10; });
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 40 * dt);
  if (flash > 0) flash = Math.max(0, flash - dt);

  if (state !== 'playing') return;
  elapsed += dt;
  // difficulty ramp
  speed = 260 + Math.min(220, distance * 0.14);
  distance += speed * dt * 0.055; // ~ metres
  score = Math.floor(distance * 2) + cornCount * 25;

  // turkey physics
  turkey.run += dt * (speed / 22);
  const targetY = laneY();
  if (turkey.jumping) {
    turkey.vy += 1800 * dt;
    turkey.y += turkey.vy * dt;
    if (turkey.y >= targetY) { turkey.y = targetY; turkey.vy = 0; turkey.jumping = false; turkey.squash = 0.3; burst(turkey.x, targetY + 26, '#d9c49a', 6, 90); }
  } else {
    turkey.y += (targetY - turkey.y) * Math.min(1, dt * 14);
    if (Math.abs(turkey.squash) > 0.01) turkey.squash *= Math.pow(0.001, dt); else turkey.squash = 0;
  }
  turkey.tilt = turkey.jumping ? (turkey.vy < 0 ? -0.12 : 0.15) : 0;
  farmerBob += dt * 11;
  farmerX += (62 - farmerX) * dt * 0.25; // farmer slowly falls back when you run clean

  // spawn
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    const dens = Math.max(0.55, 1.25 - distance * 0.00045);
    spawnTimer = dens + Math.random() * 0.7;
  }
  cornTimer -= dt;
  if (cornTimer <= 0) { spawnCorn(); cornTimer = 2.6 + Math.random() * 2.4; }

  // obstacles
  const ty = turkey.y, duck = turkey.ducking && !turkey.jumping;
  const tTop = duck ? ty - 14 : ty - 34, tBot = ty + 30, tL = turkey.x - 26, tR = turkey.x + 30;
  obstacles.forEach(ob => {
    ob.x -= speed * dt;
    const oTop = LANES[ob.lane] - 34, oBot = LANES[ob.lane] + 30;
    const overlapX = ob.x + ob.w > tL && ob.x < tR;
    const sameLane = Math.abs(LANES[ob.lane] - ty) < 46;
    if (!ob.passed && overlapX && sameLane) {
      let hit = true;
      if (ob.type === 'fence' || ob.type === 'oven') hit = turkey.y > LANES[ob.lane] - 58; // cleared only if high in the air
      if (ob.type === 'net') hit = !duck; // ducking slides under the net
      if (hit) hitObstacle(ob);
    }
    if (!ob.passed && ob.x + ob.w < tL) { ob.passed = true; score += 5; }
  });
  obstacles = obstacles.filter(o => o.x > -120);

  // corn
  corns.forEach(c => {
    c.x -= speed * dt;
    if (!c.taken && Math.abs(c.x - turkey.x) < 34 && Math.abs(LANES[c.lane] - ty) < 40) {
      c.taken = true; cornCount++; sfx.coin(); burst(c.x, LANES[c.lane] - 10, '#f2c14e', 8, 110);
    }
  });
  corns = corns.filter(c => c.x > -60 && !c.taken);

  // win
  if (distance >= WIN_DIST) gameOver(true);
}

/* ---------------- drawing ---------------- */
function drawBackground() {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#ffcf7d'); sky.addColorStop(0.45, '#ffb35c'); sky.addColorStop(0.75, '#ff9a4d'); sky.addColorStop(1, '#e87f3a');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = '#fff3c4'; ellipse(830, 78, 46, 46);
  ctx.fillStyle = '#ffe98a'; ellipse(830, 78, 34, 34);
  // clouds
  ctx.fillStyle = 'rgba(255,244,214,0.9)';
  clouds.forEach(c => { ellipse(c.x, c.y, 42 * c.s, 16 * c.s); ellipse(c.x + 30 * c.s, c.y + 6, 30 * c.s, 13 * c.s); ellipse(c.x - 32 * c.s, c.y + 7, 28 * c.s, 12 * c.s); });
  // far hills + trees
  ctx.fillStyle = '#8fae5a'; ctx.beginPath(); ctx.moveTo(0, 330); ctx.quadraticCurveTo(240, 260, 480, 320); ctx.quadraticCurveTo(720, 370, 960, 300); ctx.lineTo(960, 540); ctx.lineTo(0, 540); ctx.closePath(); ctx.fill();
  treesFar.forEach(t => { drawTree(t.x, 330, t.h, t.c, 0.8); });
  // mid trees
  treesMid.forEach(t => { drawTree(t.x, 400, t.h, t.c, 1); });
  // forest goal glow on the far right when close to winning
  if (state === 'playing' && distance > WIN_DIST - 350) {
    const a = Math.min(0.8, (distance - (WIN_DIST - 350)) / 350);
    ctx.fillStyle = 'rgba(46,125,50,' + (a * 0.35) + ')'; ctx.fillRect(W - 180, 180, 180, 360);
    ctx.fillStyle = '#2e7d32'; ctx.font = 'bold 20px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('FOREST AHEAD!', W - 90, 210);
  }
  // ground
  const g = ctx.createLinearGradient(0, 400, 0, H);
  g.addColorStop(0, '#c98a3d'); g.addColorStop(1, '#8a5a22');
  ctx.fillStyle = g; ctx.fillRect(0, 400, W, 140);
  ctx.fillStyle = '#a86f2c'; ctx.fillRect(0, 400, W, 6);
  // lane guides
  ctx.strokeStyle = 'rgba(255,240,200,0.35)'; ctx.lineWidth = 3; ctx.setLineDash([14, 18]);
  LANES.forEach(y => { ctx.beginPath(); ctx.moveTo(0, y + 34); ctx.lineTo(W, y + 34); ctx.stroke(); });
  ctx.setLineDash([]);
  // falling leaves
  leaves.forEach(l => { ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(Math.sin(frame * 0.03 + l.ph) * 0.8); ctx.fillStyle = l.c; ctx.fillRect(-l.s / 2, -l.s / 4, l.s, l.s / 2); ctx.restore(); });
}
function drawTree(x, baseY, h, color, s) {
  ctx.fillStyle = '#6b4423'; ctx.fillRect(x - 5 * s, baseY - h * 0.35, 10 * s, h * 0.35);
  ctx.fillStyle = color;
  ellipse(x, baseY - h * 0.55, 26 * s, 30 * s);
  ellipse(x - 16 * s, baseY - h * 0.35, 18 * s, 20 * s);
  ellipse(x + 16 * s, baseY - h * 0.35, 18 * s, 20 * s);
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; ellipse(x - 8 * s, baseY - h * 0.65, 12 * s, 10 * s);
}
function drawTurkey() {
  const t = turkey, duck = t.ducking && !t.jumping;
  const sq = t.squash || 0;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.tilt);
  ctx.scale(1 + sq * 0.4, 1 - sq * 0.4);
  const legSwing = Math.sin(t.run) * (t.jumping ? 4 : 10);
  // legs
  ctx.strokeStyle = '#e8a13a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, 22); ctx.lineTo(-6 + legSwing, 34); ctx.moveTo(8, 22); ctx.lineTo(8 - legSwing, 34); ctx.stroke();
  // tail feathers (fan)
  const cols = ['#d94f2b', '#e8a13a', '#8a5a2b', '#c96a1e', '#f2c14e'];
  for (let i = -2; i <= 2; i++) {
    ctx.save(); ctx.translate(-22, -6); ctx.rotate(i * 0.32 - 0.1);
    ctx.fillStyle = cols[i + 2];
    ctx.beginPath(); ctx.ellipse(-16, 0, 20, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.ellipse(-30, 0, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // body
  ctx.fillStyle = '#8b5a2b'; ellipse(0, 0, 30, duck ? 20 : 26);
  ctx.fillStyle = '#a86f2c'; ellipse(-4, 4, 22, 18);
  // wing
  ctx.fillStyle = '#6b4423'; ctx.beginPath(); ctx.ellipse(-2, 2, 16, 11, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-12, -2); ctx.quadraticCurveTo(2, 2, 10, -4); ctx.stroke();
  // head + neck
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(16, -34, 12, 22);
  ctx.fillStyle = '#c98a3d'; ellipse(24, -38, 13, 12);
  // beak + wattle
  ctx.fillStyle = '#f2a007'; ctx.beginPath(); ctx.moveTo(34, -40); ctx.lineTo(46, -36); ctx.lineTo(34, -32); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d94f2b'; ellipse(30, -28, 4, 7);
  // eye
  ctx.fillStyle = '#fff'; ellipse(27, -42, 4.5, 4.5);
  ctx.fillStyle = '#222'; ellipse(28, -42, 2.2, 2.2);
  // gobble bump
  ctx.fillStyle = '#d94f2b'; ellipse(20, -30, 3, 5);
  ctx.restore();
}
function drawFarmer() {
  const bob = Math.sin(farmerBob) * 4;
  const x = farmerX, y = LANES[lane] + 6 + bob * 0.3;
  ctx.save(); ctx.translate(x, y);
  // legs
  ctx.strokeStyle = '#3a3a6b'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-4, 12); ctx.lineTo(-4 + Math.sin(farmerBob) * 8, 28); ctx.moveTo(6, 12); ctx.lineTo(6 - Math.sin(farmerBob) * 8, 28); ctx.stroke();
  // body (red plaid)
  ctx.fillStyle = '#b03030'; rr(-14, -14, 30, 28, 6); ctx.fill();
  ctx.strokeStyle = '#7a1e1e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-14, -4); ctx.lineTo(16, -4); ctx.moveTo(-14, 6); ctx.lineTo(16, 6); ctx.moveTo(-4, -14); ctx.lineTo(-4, 14); ctx.moveTo(6, -14); ctx.lineTo(6, 14); ctx.stroke();
  // arm reaching out + pitchfork
  ctx.strokeStyle = '#f0c8a0'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(30, -14); ctx.stroke();
  ctx.strokeStyle = '#8a6d3b'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(28, -22); ctx.lineTo(40, 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24, -24); ctx.lineTo(20, -34); ctx.moveTo(28, -24); ctx.lineTo(28, -35); ctx.moveTo(32, -24); ctx.lineTo(36, -34); ctx.stroke();
  // head + hat
  ctx.fillStyle = '#f0c8a0'; ellipse(2, -24, 11, 11);
  ctx.fillStyle = '#fff'; ellipse(-2, -30, 8, 4); // beard
  ctx.fillStyle = '#7a5a1e'; ctx.fillRect(-10, -36, 26, 7); ctx.fillRect(-5, -48, 16, 13);
  ctx.fillStyle = '#222'; ellipse(5, -26, 2, 2);
  ctx.restore();
  // "!" when close
  if (farmerX > 95) {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', x, y - 58);
  }
}
function drawObstacle(ob) {
  const y = LANES[ob.lane];
  ctx.save(); ctx.translate(ob.x, y);
  if (ob.type === 'fence') {
    ctx.fillStyle = '#7a4a1e';
    ctx.fillRect(0, -26, 8, 56); ctx.fillRect(22, -26, 8, 56); ctx.fillRect(44, -26, 8, 56);
    ctx.fillStyle = '#9a6228'; ctx.fillRect(-4, -22, 60, 9); ctx.fillRect(-4, -2, 60, 9);
    ctx.fillStyle = '#c98a3d'; ctx.fillRect(-4, -22, 60, 3);
  } else if (ob.type === 'oven') {
    // brick oven — jump it!
    ctx.fillStyle = '#8a3a22'; rr(-6, -34, 64, 64, 10); ctx.fill();
    ctx.fillStyle = '#a34d2a'; rr(-2, -30, 56, 20, 6); ctx.fill();
    ctx.fillStyle = '#2b1a0e'; ctx.beginPath(); ctx.arc(26, 8, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9a2b'; ctx.beginPath(); ctx.arc(26, 10, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd23e'; ctx.beginPath(); ctx.arc(26, 12, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8e0d0'; ctx.fillRect(20, -44, 12, 10);
  } else { // net — duck under it
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(6, -70); ctx.lineTo(6, -34); ctx.moveTo(46, -70); ctx.lineTo(46, -34); ctx.stroke();
    ctx.fillStyle = 'rgba(90,58,26,0.9)';
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { ctx.fillRect(2 + i * 13, -68 + j * 12, 3, 3); }
    ctx.strokeStyle = '#8a6d3b'; ctx.lineWidth = 2;
    for (let i = 0; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(2 + i * 13, -70); ctx.lineTo(2 + i * 13, -34); ctx.stroke(); }
    for (let j = 0; j <= 3; j++) { ctx.beginPath(); ctx.moveTo(0, -70 + j * 12); ctx.lineTo(54, -70 + j * 12); ctx.stroke(); }
    ctx.fillStyle = '#d94f2b'; ctx.font = 'bold 13px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center'; ctx.fillText('DUCK!', 27, -76);
  }
  ctx.restore();
}
function drawCorn(c) {
  const y = LANES[c.lane] + Math.sin(frame * 0.08 + c.ph) * 4;
  ctx.save(); ctx.translate(c.x, y);
  ctx.fillStyle = '#2e7d32';
  ctx.beginPath(); ctx.ellipse(-12, 4, 7, 12, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, 4, 7, 12, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2c14e'; ellipse(0, 0, 10, 16);
  ctx.fillStyle = '#e8a13a';
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 5, -6, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(i * 5, 2, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(i * 5, 10, 2, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
function drawHUD() {
  // top bar
  ctx.fillStyle = 'rgba(43,26,14,0.72)'; rr(10, 10, 940, 52, 12); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.font = 'bold 22px "Trebuchet MS",sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 26, 44);
  ctx.fillStyle = '#f2c14e'; ctx.font = 'bold 18px "Trebuchet MS",sans-serif';
  ctx.fillText('🌽 ' + cornCount, 210, 43);
  ctx.fillStyle = '#fff3c4'; ctx.font = 'bold 18px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('DISTANCE ' + Math.floor(distance) + 'm / ' + WIN_DIST + 'm', 480, 43);
  // hearts
  for (let i = 0; i < 3; i++) {
    const hx = 700 + i * 34, hy = 36;
    ctx.fillStyle = i < lives ? '#e53935' : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.moveTo(hx, hy + 8);
    ctx.bezierCurveTo(hx - 12, hy - 4, hx - 6, hy - 12, hx, hy - 4);
    ctx.bezierCurveTo(hx + 6, hy - 12, hx + 12, hy - 4, hx, hy + 8); ctx.fill();
  }
  // progress to forest
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; rr(820, 24, 116, 12, 6); ctx.fill();
  ctx.fillStyle = '#4caf50'; rr(820, 24, 116 * Math.min(1, distance / WIN_DIST), 12, 6); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.font = 'bold 11px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center'; ctx.fillText('FOREST', 878, 52);
  // mute / pause buttons (top-right corner is progress; buttons bottom-right)
  ctx.fillStyle = 'rgba(43,26,14,0.72)'; rr(848, 488, 48, 40, 10); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.font = 'bold 18px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(muted ? '🔇' : '♪', 872, 516);
  ctx.fillStyle = 'rgba(43,26,14,0.72)'; rr(900, 488, 48, 40, 10); ctx.fill();
  ctx.fillText(state === 'paused' ? '▶' : 'II', 924, 516);
}
function button(x, y, w, h, label, sub) {
  ctx.fillStyle = '#d94f2b'; rr(x, y, w, h, 14); ctx.fill();
  ctx.fillStyle = '#b0301e'; rr(x, y + h - 8, w, 8, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 26px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 9);
  if (sub) { ctx.fillStyle = '#ffe9c4'; ctx.font = '15px "Trebuchet MS",sans-serif'; ctx.fillText(sub, x + w / 2, y + h + 22); }
  return { x, y, w, h };
}
let startBtn = null, restartBtn = null;
function drawTitle() {
  ctx.fillStyle = 'rgba(43,26,14,0.45)'; ctx.fillRect(0, 0, W, H);
  // banner
  ctx.fillStyle = 'rgba(255,243,196,0.95)'; rr(130, 36, 700, 150, 18); ctx.fill();
  ctx.strokeStyle = '#d94f2b'; ctx.lineWidth = 4; rr(130, 36, 700, 150, 18); ctx.stroke();
  ctx.fillStyle = '#d94f2b'; ctx.font = 'bold 64px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🦃 TURKEY', 480, 108);
  ctx.fillStyle = '#8a5a22'; ctx.font = 'bold 44px "Trebuchet MS",sans-serif';
  ctx.fillText('ESCAPE', 480, 158);
  ctx.fillStyle = '#5a3a1a'; ctx.font = '18px "Trebuchet MS",sans-serif';
  ctx.fillText('Outrun the farmer. Reach the forest. Don\'t become dinner!', 480, 214);
  // how to play card
  ctx.fillStyle = 'rgba(43,26,14,0.78)'; rr(180, 232, 600, 150, 14); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.font = 'bold 19px "Trebuchet MS",sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('HOW TO PLAY', 205, 262);
  ctx.font = '16px "Trebuchet MS",sans-serif'; ctx.fillStyle = '#ffe9c4';
  ctx.fillText('← →  or  A / D  — switch lane', 205, 290);
  ctx.fillText('SPACE / W / ↑  — jump over fences & ovens', 205, 314);
  ctx.fillText('S / ↓  — duck under the nets', 205, 338);
  ctx.fillText('Grab 🌽 corn for +25 pts  •  3 hits and you\'re caught!', 205, 362);
  ctx.fillStyle = '#f2c14e'; ctx.font = 'bold 15px "Trebuchet MS",sans-serif';
  ctx.fillText('P pause   •   R restart   •   M mute   •   Tap = jump', 205, 386 - 8);
  startBtn = button(360, 400, 240, 62, '▶  START', best > 0 ? 'Best score: ' + best : 'Escape 1500m to win!');
}
function drawPaused() {
  ctx.fillStyle = 'rgba(43,26,14,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff3c4'; ctx.font = 'bold 52px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('PAUSED', 480, 230);
  ctx.font = '20px "Trebuchet MS",sans-serif';
  ctx.fillText('Press P or tap Resume to keep running', 480, 270);
  restartBtn = button(360, 300, 240, 60, '▶  RESUME');
}
function drawOver() {
  ctx.fillStyle = 'rgba(43,26,14,0.65)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ff8a65'; ctx.font = 'bold 56px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('CAUGHT!', 480, 190);
  ctx.fillStyle = '#fff3c4'; ctx.font = '22px "Trebuchet MS",sans-serif';
  ctx.fillText('The farmer got you after ' + Math.floor(distance) + 'm.', 480, 240);
  ctx.font = 'bold 26px "Trebuchet MS",sans-serif'; ctx.fillStyle = '#f2c14e';
  ctx.fillText('SCORE ' + score + '   •   🌽 ' + cornCount + '   •   BEST ' + best, 480, 285);
  restartBtn = button(360, 320, 240, 62, '↻  TRY AGAIN', 'or press R');
}
function drawWin() {
  ctx.fillStyle = 'rgba(20,60,25,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#a5d6a7'; ctx.font = 'bold 52px "Trebuchet MS",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🎉 YOU ESCAPED!', 480, 190);
  ctx.fillStyle = '#fff3c4'; ctx.font = '22px "Trebuchet MS",sans-serif';
  ctx.fillText('You made it 1500m to the safety of the forest!', 480, 240);
  ctx.font = 'bold 26px "Trebuchet MS",sans-serif'; ctx.fillStyle = '#f2c14e';
  ctx.fillText('SCORE ' + score + '   •   🌽 ' + cornCount + '   •   LIVES LEFT ' + lives, 480, 285);
  restartBtn = button(360, 320, 240, 62, '↻  PLAY AGAIN', 'or press R');
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  // world objects (behind HUD, in front of background)
  corns.forEach(drawCorn);
  obstacles.forEach(drawObstacle);
  drawFarmer();
  drawTurkey();
  particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); });
  ctx.globalAlpha = 1;
  if (state === 'playing' || state === 'paused') drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'paused') drawPaused();
  if (state === 'over') drawOver();
  if (state === 'win') drawWin();
  if (flash > 0) { ctx.fillStyle = 'rgba(255,60,40,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

/* ---------------- input ---------------- */
function inBtn(b, x, y) { return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}
function onPress(e) {
  e.preventDefault();
  const p = canvasPos(e);
  // mute / pause buttons (bottom right)
  if (state === 'playing' || state === 'paused') {
    if (p.x >= 848 && p.x <= 896 && p.y >= 488 && p.y <= 528) { muted = !muted; sfx.click(); return; }
    if (p.x >= 900 && p.x <= 948 && p.y >= 488 && p.y <= 528) { togglePause(); return; }
  }
  if (state === 'title' && inBtn(startBtn, p.x, p.y)) { sfx.click(); resetGame(); return; }
  if ((state === 'over' || state === 'win' || state === 'paused') && inBtn(restartBtn, p.x, p.y)) {
    sfx.click(); if (state === 'paused') { state = 'playing'; startMusic(); } else resetGame(); return;
  }
  if (state === 'playing') doJump();
  else if (state === 'title') resetGame();
}
cv.addEventListener('mousedown', onPress);
cv.addEventListener('touchstart', onPress, { passive: false });
function togglePause() {
  if (state === 'playing') { state = 'paused'; stopMusic(); }
  else if (state === 'paused') { state = 'playing'; startMusic(); }
}
window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') moveLane(-1);
  else if (k === 'arrowright' || k === 'd') moveLane(1);
  else if (k === 'arrowup') moveLane(-1);
  else if (k === 'arrowdown') { if (state === 'playing') { doDuck(true); setTimeout(() => doDuck(false), 450); } else moveLane(1); }
  else if (k === ' ' || k === 'w') { if (state === 'title' || state === 'over' || state === 'win') resetGame(); else doJump(); }
  else if (k === 's') { if (state === 'playing') { doDuck(true); setTimeout(() => doDuck(false), 450); } }
  else if (k === 'enter') { if (state !== 'playing') resetGame(); }
  else if (k === 'p') togglePause();
  else if (k === 'r') { if (state !== 'title') resetGame(); }
  else if (k === 'm') { muted = !muted; }
});
window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() === 's' || e.key === 'ArrowDown') doDuck(false); });

/* ---------------- main loop ---------------- */
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
