<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Escape — Run 1500m!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #2b1d0e; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
    color: #fff3d6; overflow: hidden;
  }
  #wrap { position: relative; width: min(960px, 100vw); }
  canvas {
    display: block; width: 100%; height: auto;
    background: #87bfe8; border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
    cursor: pointer;
  }
  #hint {
    text-align: center; font-size: 13px; opacity: .85;
    padding: 8px 4px 0; line-height: 1.5;
  }
  #hint b { color: #ffd75e; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hint">
    <b>Arrows / A D</b> switch lane &nbsp;·&nbsp; <b>Space / W</b> jump &nbsp;·&nbsp;
    <b>S / Down</b> duck &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>R</b> restart &nbsp;·&nbsp;
    <b>M</b> mute &nbsp;·&nbsp; click to jump
  </div>
</div>
<script>
"use strict";
/* ============================================================
   TURKEY ESCAPE — a fresh offline HTML5 Canvas game.
   A turkey flees a farmer across autumn fields: 3 lanes,
   fences and ovens to jump, nets to duck under, corn to grab.
   Reach 1500m and the forest is safety. 3 hits and you are caught.
   No images, no network — every sprite is vector art drawn here.
   ============================================================ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 960, H = 540;

const LANES = [180, 292, 404];      // y centre of each of the 3 lanes
const TURKEY_X = 175;               // turkey stays near the left edge
const WIN_DIST = 1500;              // metres to the forest
const GRAVITY = 1500;               // px / s^2 for the jump arc

/* ---------------- audio: tiny WebAudio synth, no files ---------------- */
const AudioKit = {
  ctx: null, muted: false, melodyTimer: null, noteStep: 0,
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, type, vol, slideTo) {
    if (this.muted) return;
    const ac = this.ensure(); if (!ac) return;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
    gain.gain.setValueAtTime(vol || 0.12, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + dur);
  },
  noise(dur, vol) {
    if (this.muted) return;
    const ac = this.ensure(); if (!ac) return;
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(), gain = ac.createGain();
    src.buffer = buf; gain.gain.value = vol || 0.2;
    src.connect(gain); gain.connect(ac.destination); src.start();
  },
  jump()  { this.tone(280, 0.22, "sine", 0.14, 620); },
  coin()  { this.tone(880, 0.09, "square", 0.07); this.tone(1320, 0.14, "square", 0.06); },
  crash() { this.noise(0.25, 0.25); this.tone(140, 0.3, "sawtooth", 0.12, 60); },
  gobble(){ this.tone(320, 0.08, "square", 0.09, 210); this.tone(260, 0.1, "square", 0.09, 170); },
  win()   { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.35, "triangle", 0.14), i * 130)); },
  startMelody() {
    if (this.melodyTimer) return;
    const scale = [392, 440, 494, 523, 587, 659, 587, 523];
    this.melodyTimer = setInterval(() => {
      if (!state.playing || this.muted) return;
      this.tone(scale[this.noteStep % scale.length], 0.22, "triangle", 0.045);
      this.noteStep++;
    }, 260);
  },
  stopMelody() { if (this.melodyTimer) { clearInterval(this.melodyTimer); this.melodyTimer = null; } }
};

/* ---------------- game state ---------------- */
const state = {
  screen: "title",      // title | playing | paused | over | win
  lane: 1,              // 0 top, 1 middle, 2 bottom
  yOff: 0,              // jump height offset (px, negative = up)
  vy: 0, jumping: false, ducking: false,
  dist: 0, score: 0, corn: 0, lives: 3, cleared: 0,
  speed: 250, spawnT: 0, elapsed: 0,
  obstacles: [], corns: [], particles: [], leaves: [],
  farmerX: 60, shake: 0, flash: 0, best: 0,
  trees: [], clouds: []
};
try { state.best = parseInt(localStorage.getItem("turkey-escape-best") || "0", 10) || 0; }
catch (e) { state.best = 0; }

function saveBest() {
  if (state.score > state.best) {
    state.best = state.score;
    try { localStorage.setItem("turkey-escape-best", String(state.best)); } catch (e) {}
  }
}

/* scenery: deterministic-ish placement, randomised at reset */
function buildScenery() {
  state.trees = [];
  for (let i = 0; i < 14; i++) {
    state.trees.push({ x: i * 75 + Math.random() * 40, depth: i % 2, hue: 20 + Math.random() * 25 });
  }
  state.clouds = [];
  for (let i = 0; i < 5; i++) {
    state.clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 70, s: 0.7 + Math.random() * 0.8 });
  }
  state.leaves = [];
  for (let i = 0; i < 26; i++) {
    state.leaves.push({ x: Math.random() * W, y: Math.random() * H, vy: 22 + Math.random() * 30, sway: Math.random() * 6.28, c: ["#e07b39", "#d9a441", "#b5542d"][i % 3] });
  }
}

function resetGame() {
  state.lane = 1; state.yOff = 0; state.vy = 0;
  state.jumping = false; state.ducking = false;
  state.dist = 0; state.score = 0; state.corn = 0; state.lives = 3; state.cleared = 0;
  state.speed = 250; state.spawnT = 0.9; state.elapsed = 0;
  state.obstacles = []; state.corns = []; state.particles = [];
  state.farmerX = 60; state.shake = 0; state.flash = 0;
  buildScenery();
  state.screen = "playing";
  AudioKit.ensure(); AudioKit.startMelody(); AudioKit.gobble();
}

function burst(x, y, color, n) {
  for (let i = 0; i < (n || 12); i++) {
    state.particles.push({
      x, y, vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 220 - 40,
      life: 0.6 + Math.random() * 0.4, color
    });
  }
}

/* ---------------- spawning ---------------- */
function spawnRow() {
  const lane = Math.floor(Math.random() * 3);
  const roll = Math.random();
  const kind = roll < 0.36 ? "fence" : roll < 0.68 ? "oven" : "net";
  state.obstacles.push({ x: W + 60, lane, kind, passed: false, wobble: Math.random() * 6.28 });
  // corn: sometimes a line of 3 in a free lane, sometimes one near the obstacle lane
  if (Math.random() < 0.62) {
    const cornLane = Math.random() < 0.5 ? lane : Math.floor(Math.random() * 3);
    const baseX = W + 120 + Math.random() * 160;
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) state.corns.push({ x: baseX + i * 46, lane: cornLane, taken: false, spin: Math.random() * 6.28 });
  }
}

/* ---------------- actions ---------------- */
function doJump() {
  if (state.screen === "title") { resetGame(); return; }
  if (state.screen === "over" || state.screen === "win") { resetGame(); return; }
  if (state.screen !== "playing") return;
  if (!state.jumping) {
    state.jumping = true; state.vy = -620; state.ducking = false;
    AudioKit.jump();
  }
}
function doDuck(on) {
  if (state.screen !== "playing") return;
  state.ducking = on && !state.jumping;
}
function moveLane(dir) {
  if (state.screen !== "playing") return;
  const next = state.lane + dir;
  if (next >= 0 && next <= 2) { state.lane = next; AudioKit.tone(500, 0.06, "sine", 0.05); }
}
function togglePause() {
  if (state.screen === "playing") { state.screen = "paused"; AudioKit.stopMelody(); }
  else if (state.screen === "paused") { state.screen = "playing"; AudioKit.startMelody(); }
}
function toggleMute() {
  AudioKit.muted = !AudioKit.muted;
  if (AudioKit.muted) AudioKit.stopMelody();
  else if (state.screen === "playing") AudioKit.startMelody();
}

function takeHit(ob) {
  state.lives--;
  state.flash = 0.35; state.shake = 14;
  state.farmerX = Math.min(state.farmerX + 42, TURKEY_X - 46);
  burst(TURKEY_X, LANES[state.lane] + state.yOff, "#ff5a4e", 16);
  AudioKit.crash();
  ob.passed = true;
  if (state.lives <= 0) {
    state.screen = "over"; saveBest(); AudioKit.stopMelody();
  }
}

/* ---------------- update ---------------- */
function update(dt) {
  if (state.screen !== "playing") return;
  state.elapsed += dt;
  const ramp = Math.min(1, state.dist / WIN_DIST);
  state.speed = 250 + ramp * 230;
  state.dist += (state.speed * dt) / 14;   // ~14 px per metre
  state.score = Math.floor(state.dist * 2) + state.corn * 25 + state.cleared * 5;

  // jump physics
  if (state.jumping) {
    state.vy += GRAVITY * dt;
    state.yOff += state.vy * dt;
    if (state.yOff >= 0) { state.yOff = 0; state.vy = 0; state.jumping = false; burst(TURKEY_X, LANES[state.lane], "#d9c9a8", 6); }
  }

  // spawn
  state.spawnT -= dt;
  if (state.spawnT <= 0) {
    spawnRow();
    state.spawnT = Math.max(0.55, 1.25 - ramp * 0.7) * (0.85 + Math.random() * 0.35);
  }

  const ty = LANES[state.lane] + state.yOff;
  const tH = state.ducking ? 26 : 52;      // ducking shrinks the hitbox
  const tTop = ty - tH / 2, tBot = ty + tH / 2;

  // obstacles
  for (const ob of state.obstacles) {
    ob.x -= state.speed * dt;
    if (!ob.passed && ob.x < TURKEY_X - 30) {
      ob.passed = true;
      state.cleared++;                    // cleared it cleanly (+5 in the score formula)
    }
    if (Math.abs(ob.x - TURKEY_X) < 46) {
      const oy = LANES[ob.lane];
      if (ob.kind === "net") {
        // net hangs from above: safe only while ducking low
        if (!state.ducking && tTop < oy - 6) takeHit(ob);
      } else {
        // fence / oven: safe only while high in the air
        if (tBot > oy + 8) takeHit(ob);
      }
    }
  }
  state.obstacles = state.obstacles.filter(o => o.x > -120);

  // corn
  for (const c of state.corns) {
    c.x -= state.speed * dt; c.spin += dt * 5;
    if (!c.taken && Math.abs(c.x - TURKEY_X) < 42 && Math.abs(LANES[c.lane] - ty) < 44) {
      c.taken = true; state.corn++;
      burst(c.x, LANES[c.lane], "#ffd75e", 8);
      AudioKit.coin();
    }
  }
  state.corns = state.corns.filter(c => c.x > -60 && !c.taken);

  // farmer: creeps back when clean, lunges on hits
  state.farmerX += (62 - state.farmerX) * dt * 0.25;
  if (state.farmerX > TURKEY_X - 50) state.farmerX = TURKEY_X - 50;

  // particles + leaves + scenery drift
  for (const p of state.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  state.particles = state.particles.filter(p => p.life > 0);
  for (const l of state.leaves) {
    l.y += l.vy * dt; l.x += Math.sin(state.elapsed * 2 + l.sway) * 26 * dt - state.speed * dt * 0.12;
    if (l.y > H + 8) { l.y = -8; l.x = Math.random() * W; }
    if (l.x < -10) l.x = W + 6;
  }
  for (const c of state.clouds) { c.x -= 12 * dt; if (c.x < -120) { c.x = W + 100; c.y = 30 + Math.random() * 70; } }
  for (const t of state.trees) { t.x -= state.speed * dt * (t.depth === 0 ? 0.25 : 0.5); if (t.x < -60) t.x = W + 50; }

  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
  if (state.flash > 0) state.flash -= dt;

  // win!
  if (state.dist >= WIN_DIST) {
    state.dist = WIN_DIST; state.screen = "win";
    saveBest(); AudioKit.stopMelody(); AudioKit.win();
    burst(TURKEY_X + 40, LANES[state.lane] - 30, "#ffd75e", 30);
  }
}

/* ---------------- drawing ---------------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#7fb9e8"); g.addColorStop(0.55, "#f6c453"); g.addColorStop(1, "#e07b39");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = "#ffe9a3";
  ctx.beginPath(); ctx.arc(830, 78, 42, 0, 6.29); ctx.fill();
  ctx.fillStyle = "rgba(255,233,163,.35)";
  ctx.beginPath(); ctx.arc(830, 78, 58, 0, 6.29); ctx.fill();
  // clouds
  ctx.fillStyle = "rgba(255,255,255,.9)";
  for (const c of state.clouds) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 46 * c.s, 16 * c.s, 0, 0, 6.29);
    ctx.ellipse(c.x - 28 * c.s, c.y + 6, 28 * c.s, 12 * c.s, 0, 0, 6.29);
    ctx.ellipse(c.x + 30 * c.s, c.y + 6, 30 * c.s, 12 * c.s, 0, 0, 6.29);
    ctx.fill();
  }
  // distant forest glow near the end
  if (state.dist > WIN_DIST - 350) {
    const a = Math.min(0.5, (state.dist - (WIN_DIST - 350)) / 350 * 0.5);
    ctx.fillStyle = "rgba(46,125,50," + a + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 26px Trebuchet MS, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("FOREST AHEAD!", W / 2, 84);
  }
}

function drawField() {
  // ground
  ctx.fillStyle = "#8a5a2b"; ctx.fillRect(0, 118, W, H - 118);
  ctx.fillStyle = "#a9743c"; ctx.fillRect(0, 118, W, 10);
  // lane strips
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i % 2 === 0 ? "#c08d4e" : "#b38144";
    ctx.fillRect(0, LANES[i] - 52, W, 104);
    ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.setLineDash([14, 12]);
    ctx.beginPath(); ctx.moveTo(0, LANES[i] + 52); ctx.lineTo(W, LANES[i] + 52); ctx.stroke();
    ctx.setLineDash([]);
  }
  // parallax trees behind the lanes
  for (const t of state.trees) {
    const y = 96 + t.depth * 14, s = t.depth === 0 ? 0.8 : 1.15;
    ctx.fillStyle = "#6d3f1d"; ctx.fillRect(t.x - 4 * s, y, 8 * s, 30 * s);
    ctx.fillStyle = "hsl(" + t.hue + ", 62%, 42%)";
    ctx.beginPath(); ctx.arc(t.x, y - 8 * s, 26 * s, 0, 6.29); ctx.fill();
    ctx.fillStyle = "hsl(" + (t.hue + 18) + ", 65%, 52%)";
    ctx.beginPath(); ctx.arc(t.x - 14 * s, y + 2 * s, 16 * s, 0, 6.29); ctx.fill();
  }
  // falling leaves
  for (const l of state.leaves) {
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(Math.sin(state.elapsed * 3 + l.sway) * 0.9);
    ctx.fillStyle = l.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore();
  }
}

function drawTurkey(x, y, ducking) {
  const squash = state.jumping ? 1.12 : ducking ? 0.72 : 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(1, squash);
  // tail feathers fanning behind
  ctx.fillStyle = "#8d4a1f";
  for (let i = -2; i <= 2; i++) {
    ctx.save(); ctx.rotate(i * 0.32);
    ctx.beginPath(); ctx.ellipse(-26, -16, 9, 22, 0, 0, 6.29); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = "#c97b2e";
  ctx.beginPath(); ctx.ellipse(-18, -10, 8, 16, -0.3, 0, 6.29); ctx.fill();
  // body
  ctx.fillStyle = "#7a4a21";
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 24, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#a06a33";
  ctx.beginPath(); ctx.ellipse(2, 4, 22, 16, 0, 0, 6.29); ctx.fill();
  // wing
  ctx.fillStyle = "#5d3617";
  ctx.beginPath(); ctx.ellipse(-4, -2, 16, 10, -0.4, 0, 6.29); ctx.fill();
  // head + beak + wattle
  ctx.fillStyle = "#7a4a21";
  ctx.beginPath(); ctx.arc(24, -22, 13, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#e8a13c";
  ctx.beginPath(); ctx.moveTo(35, -24); ctx.lineTo(48, -19); ctx.lineTo(35, -14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#d94f3d";
  ctx.beginPath(); ctx.ellipse(30, -12, 4, 8, 0.2, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(27, -26, 4, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#1d1d1d";
  ctx.beginPath(); ctx.arc(28, -26, 2, 0, 6.29); ctx.fill();
  // legs
  ctx.strokeStyle = "#e8a13c"; ctx.lineWidth = 4;
  const legSwing = state.screen === "playing" ? Math.sin(state.elapsed * 18) * 8 : 0;
  ctx.beginPath(); ctx.moveTo(-8, 20); ctx.lineTo(-8 + legSwing, 34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 20); ctx.lineTo(8 - legSwing, 34); ctx.stroke();
  ctx.restore();
}

function drawFarmer(x, y) {
  const bob = state.screen === "playing" ? Math.sin(state.elapsed * 14) * 3 : 0;
  ctx.save(); ctx.translate(x, y + bob);
  // pitchfork
  ctx.strokeStyle = "#8a8f98"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-34, -58); ctx.lineTo(-34, 18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-42, -58); ctx.lineTo(-42, -40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-26, -58); ctx.lineTo(-26, -40); ctx.stroke();
  // legs
  ctx.strokeStyle = "#3b4a6b"; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-6, 8); ctx.lineTo(-12, 34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(12, 34); ctx.stroke();
  // overalls + shirt
  ctx.fillStyle = "#3b4a6b"; roundRect(-16, -6, 32, 26, 6); ctx.fill();
  ctx.fillStyle = "#c94f3d"; roundRect(-17, -34, 34, 30, 8); ctx.fill();
  // head + straw hat
  ctx.fillStyle = "#f0c49a";
  ctx.beginPath(); ctx.arc(0, -44, 13, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#d9a441";
  ctx.beginPath(); ctx.ellipse(0, -52, 22, 6, 0, 0, 6.29); ctx.fill();
  ctx.fillRect(-11, -66, 22, 14);
  ctx.fillStyle = "#1d1d1d";
  ctx.beginPath(); ctx.arc(5, -46, 2, 0, 6.29); ctx.fill();
  ctx.restore();
}

function drawObstacle(ob) {
  const y = LANES[ob.lane];
  ctx.save(); ctx.translate(ob.x, y);
  if (ob.kind === "fence") {
    ctx.fillStyle = "#7a4a21";
    ctx.fillRect(-26, -34, 8, 68); ctx.fillRect(18, -34, 8, 68);
    ctx.fillStyle = "#9c6a35";
    ctx.fillRect(-32, -30, 64, 10); ctx.fillRect(-32, -8, 64, 10); ctx.fillRect(-32, 14, 64, 10);
  } else if (ob.kind === "oven") {
    ctx.fillStyle = "#8e3b2f";
    roundRect(-30, -40, 60, 74, 6); ctx.fill();
    ctx.fillStyle = "#b5542d";
    for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) ctx.fillRect(-26 + c * 28, -36 + r * 22, 22, 14);
    ctx.fillStyle = "#1d1d1d";
    ctx.beginPath(); ctx.arc(0, 8, 13, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#ff9d2e";
    ctx.beginPath(); ctx.arc(0, 12, 8, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#6b6b6b"; ctx.fillRect(14, -58, 10, 20);
  } else { // net, hanging from above
    ctx.strokeStyle = "#e8e2d0"; ctx.lineWidth = 2;
    ctx.strokeRect(-30, -52, 60, 46);
    ctx.beginPath();
    for (let i = -20; i <= 20; i += 10) { ctx.moveTo(i, -52); ctx.lineTo(i, -6); }
    for (let j = -42; j <= -6; j += 12) { ctx.moveTo(-30, j); ctx.lineTo(30, j); }
    ctx.stroke();
    ctx.fillStyle = "#7a4a21"; ctx.fillRect(-34, -56, 68, 6);
  }
  ctx.restore();
}

function drawCorn(c) {
  const y = LANES[c.lane];
  ctx.save(); ctx.translate(c.x, y); ctx.rotate(Math.sin(c.spin) * 0.25);
  ctx.fillStyle = "#2e7d32";
  ctx.beginPath(); ctx.ellipse(0, -16, 6, 12, -0.4, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#ffd75e";
  ctx.beginPath(); ctx.ellipse(0, 0, 11, 18, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#e8a13c";
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 6, -6, 2.4, 0, 6.29); ctx.fill(); ctx.beginPath(); ctx.arc(i * 6, 4, 2.4, 0, 6.29); ctx.fill(); }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = "rgba(20,12,4,.55)";
  roundRect(12, 10, 400, 56, 10); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.font = "bold 20px Trebuchet MS, sans-serif";
  ctx.fillText("Score " + state.score, 26, 34);
  ctx.fillText("Corn " + state.corn, 26, 58);
  ctx.fillStyle = "#ffd75e";
  ctx.fillText(Math.floor(state.dist) + "m / 1500m", 210, 34);
  ctx.fillText("Best " + state.best, 210, 58);
  // hearts
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < state.lives ? "#ff5a6e" : "rgba(255,255,255,.25)";
    const hx = 440 + i * 30, hy = 34;
    ctx.beginPath();
    ctx.moveTo(hx, hy + 8);
    ctx.bezierCurveTo(hx - 12, hy - 4, hx - 6, hy - 14, hx, hy - 5);
    ctx.bezierCurveTo(hx + 6, hy - 14, hx + 12, hy - 4, hx, hy + 8);
    ctx.fill();
  }
  // progress bar to the forest
  ctx.fillStyle = "rgba(20,12,4,.55)";
  roundRect(430, 16, 300, 18, 9); ctx.fill();
  ctx.fillStyle = "#57a773";
  roundRect(432, 18, 296 * Math.min(1, state.dist / WIN_DIST), 14, 7); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 13px Trebuchet MS, sans-serif"; ctx.textAlign = "center";
  ctx.fillText("FOREST", 580, 46);
  // pause + mute buttons (bottom right)
  ctx.fillStyle = "rgba(20,12,4,.55)";
  roundRect(W - 118, H - 52, 50, 38, 8); ctx.fill();
  roundRect(W - 60, H - 52, 50, 38, 8); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px Trebuchet MS, sans-serif";
  ctx.fillText("II", W - 93, H - 26);
  ctx.fillText(AudioKit.muted ? "X" : "♪", W - 35, H - 26);
}

function drawCard(title, lines, accent) {
  ctx.fillStyle = "rgba(20,12,4,.72)";
  roundRect(180, 110, 600, 320, 18); ctx.fill();
  ctx.strokeStyle = accent || "#ffd75e"; ctx.lineWidth = 3;
  roundRect(180, 110, 600, 320, 18); ctx.stroke();
  ctx.textAlign = "center";
  ctx.fillStyle = accent || "#ffd75e";
  ctx.font = "bold 44px Trebuchet MS, sans-serif";
  ctx.fillText(title, W / 2, 178);
  ctx.fillStyle = "#fff3d6"; ctx.font = "20px Trebuchet MS, sans-serif";
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, 226 + i * 34));
}

function draw() {
  ctx.save();
  if (state.shake > 0) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
  drawSky();
  drawField();
  for (const c of state.corns) drawCorn(c);
  for (const ob of state.obstacles) drawObstacle(ob);
  drawFarmer(state.farmerX, LANES[state.lane]);
  drawTurkey(TURKEY_X, LANES[state.lane] + state.yOff, state.ducking);
  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state.flash > 0) {
    ctx.fillStyle = "rgba(255,40,30," + (state.flash * 0.7) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();

  if (state.screen === "title") {
    drawCard("TURKEY ESCAPE", [
      "Thanksgiving morning — the farmer is after you!",
      "Run 1500m, dodge fences and ovens, duck the nets,",
      "grab corn for +25. Three hits and you are caught.",
      "",
      "Press SPACE or click START to run!"
    ], "#ffd75e");
    ctx.fillStyle = "#2e7d32";
    roundRect(380, 372, 200, 48, 12); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 24px Trebuchet MS, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("▶  START", W / 2, 403);
  } else if (state.screen === "paused") {
    drawCard("PAUSED", ["Take a breath, turkey.", "Press P or click to keep running."], "#87bfe8");
  } else if (state.screen === "over") {
    drawCard("CAUGHT!", [
      "The farmer got you at " + Math.floor(state.dist) + "m.",
      "Score " + state.score + "  ·  Corn " + state.corn + "  ·  Best " + state.best,
      "",
      "Press R or click to try again."
    ], "#ff5a6e");
  } else if (state.screen === "win") {
    drawCard("YOU ESCAPED!", [
      "1500m! You made it to the forest, safe and free.",
      "Score " + state.score + "  ·  Corn " + state.corn + "  ·  Best " + state.best,
      "",
      "Press R or click to run again."
    ], "#57a773");
  }
}

/* ---------------- input ---------------- */
function buttonAt(x, y) {
  // pause button, mute button, start button
  if (x > W - 118 && x < W - 68 && y > H - 52 && y < H - 14) return "pause";
  if (x > W - 60 && x < W - 10 && y > H - 52 && y < H - 14) return "mute";
  if (state.screen === "title" && x > 380 && x < 580 && y > 372 && y < 420) return "start";
  return null;
}
canvas.addEventListener("click", (e) => {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  const y = (e.clientY - r.top) * (H / r.height);
  const btn = buttonAt(x, y);
  if (btn === "pause") { togglePause(); return; }
  if (btn === "mute") { toggleMute(); return; }
  if (btn === "start") { resetGame(); return; }
  doJump();
});
window.addEventListener("keydown", (e) => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === "ArrowLeft" || e.code === "KeyA") moveLane(-1);
  else if (e.code === "ArrowRight" || e.code === "KeyD") moveLane(1);
  else if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") doJump();
  else if (e.code === "ArrowDown" || e.code === "KeyS") doDuck(true);
  else if (e.code === "KeyP") togglePause();
  else if (e.code === "KeyR") { if (state.screen === "over" || state.screen === "win") resetGame(); }
  else if (e.code === "KeyM") toggleMute();
  else if (e.code === "Enter" && state.screen !== "playing") resetGame();
});
window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowDown" || e.code === "KeyS") doDuck(false);
});

/* ---------------- main loop ---------------- */
buildScenery();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
